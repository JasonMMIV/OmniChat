name: SDK Floor

# The project declares `environment.sdk: ^3.13.0` / Flutter >= 3.47. `sqlite3`
# 3.8 pulls meta ^1.19.0 via hooks/record_use, but Flutter 3.44 pins meta
# 1.18.0; 3.47 is the first stable line that resolves. Keep a dedicated floor
# job so the declared minimum is not silently untested.
on:
  workflow_dispatch:
  # Weekly canary; a floor break should not block unrelated PRs.
  schedule:
    - cron: '0 3 * * 1'
  push:
    branches: [master]
    paths:
      - pubspec.yaml
      - .github/workflows/sdk-floor.yml

permissions:
  contents: read

jobs:
  sdk-floor:
    name: Flutter 3.47 / Dart 3.13 floor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter 3.47
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          dart --version

      - name: Resolve dependencies
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee pub-get.log

      # Job logs are not public for this repository; surface the solver error in
      # the check annotation so a red floor run is diagnosable without signing in.
      - name: Report dependency resolution failure
        if: failure()
        run: |
          if [ ! -f pub-get.log ]; then exit 0; fi
          msg=$(tail -n 25 pub-get.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=flutter pub get failed::$msg"

      - name: Analyze app sources
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: Run floor smoke tests
        run: >
          flutter test
          test/markdown_render_policy_test.dart
          test/markdown_surface_contrast_test.dart
          test/long_image_export_plan_test.dart
