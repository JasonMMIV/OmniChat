<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>回答審查 · 圖示候選</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  :root {
    --bg: #f5f5f7;
    --panel: #ffffff;
    --panel-2: #fafafa;
    --text: #1f1f23;
    --muted: #7e7f83;
    --line: #e7e7ea;
    --accent: #5b5bd6;
    --accent-soft: rgba(91, 91, 214, 0.10);
    --shadow: 0 12px 36px rgba(0, 0, 0, 0.06);
  }
  html.dark {
    --bg: #111114;
    --panel: #1b1b1f;
    --panel-2: #202025;
    --text: #f2f2f5;
    --muted: #9e9ea4;
    --line: #303036;
    --accent: #a5a5ff;
    --accent-soft: rgba(165, 165, 255, 0.12);
    --shadow: 0 16px 44px rgba(0, 0, 0, 0.34);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(circle at 15% 0%, var(--accent-soft), transparent 34rem), var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 44px 28px 64px; }
  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
  h1 { margin: 0 0 8px; font-size: 26px; letter-spacing: -0.02em; }
  .sub { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.65; }
  .theme {
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
    border-radius: 999px; padding: 9px 15px; font-size: 13px; cursor: pointer;
    box-shadow: var(--shadow); white-space: nowrap;
  }
  .theme:hover { border-color: var(--accent); }
  .note {
    display: flex; gap: 10px; align-items: flex-start; padding: 13px 16px;
    background: var(--accent-soft); border-radius: 14px; color: var(--muted);
    font-size: 12.5px; line-height: 1.65; margin-bottom: 24px;
  }
  .note strong { color: var(--text); font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } .wrap { padding: 28px 16px 48px; } header { flex-direction: column; } }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
    padding: 17px 18px 15px; cursor: pointer; transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    box-shadow: 0 2px 8px rgba(0,0,0,.025);
  }
  .card:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: var(--shadow); }
  .card.selected { border-color: var(--accent); background: linear-gradient(180deg, var(--accent-soft), transparent 70%), var(--panel); }
  .top { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
  .glyph {
    width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center;
    background: var(--panel-2); color: var(--muted); flex: none;
  }
  .glyph svg { width: 30px; height: 30px; stroke-width: 1.75; }
  .name { font-size: 14px; font-weight: 650; letter-spacing: -0.01em; }
  .code { font: 11.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); margin-top: 2px; }
  .desc { font-size: 12.5px; color: var(--muted); line-height: 1.55; margin: 0 0 12px; }
  .rowmock {
    display: flex; align-items: center; gap: 8px; padding: 5px 4px;
    border-radius: 10px; color: var(--muted); min-height: 28px;
  }
  .rowmock svg { width: 18px; height: 18px; stroke-width: 1.8; flex: none; }
  .rowmock .label { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rowmock .chev { margin-left: auto; opacity: .8; }
  .rowmock .chev svg { width: 18px; height: 18px; }
  .current {
    display: inline-flex; align-items: center; height: 20px; padding: 0 7px;
    border-radius: 999px; background: var(--accent-soft); color: var(--accent);
    font-size: 10.5px; font-weight: 650; letter-spacing: .01em; margin-left: 7px; vertical-align: 2px;
  }
  .selected-note {
    position: sticky; bottom: 18px; margin-top: 24px; padding: 13px 17px;
    background: color-mix(in srgb, var(--panel) 88%, transparent); backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow);
    display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12.5px;
  }
  .selected-note strong { color: var(--text); font-weight: 650; }
  .selected-note code { color: var(--accent); font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>回答審查 · 圖示候選</h1>
      <p class="sub">每一列都套用實際卡片樣式：18px 圖示、13px 淺灰字、透明背景、無框線。<br>點選任一圖示即可標記你的選擇。</p>
    </div>
    <button class="theme" id="themeBtn">切換深色</button>
  </header>

  <div class="note">
    <span>💡</span>
    <div><strong>目前使用：</strong><code>ScanSearch</code>（掃描框＋放大鏡）。下方同時顯示大圖與實際 18px 列內效果，方便比較。</div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="selected-note">
    <span>已選擇</span>
    <strong id="selectedName">ScanSearch</strong>
    <code id="selectedCode">Lucide.ScanSearch</code>
    <span style="margin-left:auto">把這個名稱告訴我即可</span>
  </div>
</div>

<script>
const candidates = [
  { code: 'scan-search', dart: 'ScanSearch', zh: '掃描框＋放大鏡', desc: '強調「檢查細節」；目前使用，和 process group 摘要一致。', current: true },
  { code: 'shield-check', dart: 'ShieldCheck', zh: '盾牌打勾', desc: '強調「品質把關、已驗證」，安全與可信感最強。' },
  { code: 'badge-check', dart: 'BadgeCheck', zh: '徽章打勾', desc: '強調「通過認證」，比盾牌更輕、更像審核結果。' },
  { code: 'clipboard-check', dart: 'ClipboardCheck', zh: '剪貼板打勾', desc: '強調「審核清單／逐項檢查」，很有 review 的語意。' },
  { code: 'list-checks', dart: 'ListChecks', zh: '清單打勾', desc: '強調「逐項核對」，和待辦清單接近，較不像審查。' },
  { code: 'file-search', dart: 'FileSearch', zh: '文件＋放大鏡', desc: '強調「檢查文件內容」，偏文件搜尋而非回答審查。' },
  { code: 'search-check', dart: 'SearchCheck', zh: '放大鏡打勾', desc: '強調「檢查完成」，動作感清楚但比較像搜尋結果。' },
  { code: 'message-square-check', dart: 'MessageSquareCheck', zh: '對話框打勾', desc: '強調「回覆已檢查」，直接指向聊天回答。' },
  { code: 'scan-text', dart: 'ScanText', zh: '文字掃描', desc: '強調「逐字審查」，與回答的文字內容最貼近。' },
  { code: 'fingerprint', dart: 'Fingerprint', zh: '指紋', desc: '強調「一致性／真實性」，較抽象但很有識別度。' },
  { code: 'sparkles', dart: 'Sparkles', zh: '閃光', desc: '強調「AI 潤飾」，容易和生成／魔法感混淆。' },
  { code: 'eye', dart: 'Eye', zh: '眼睛', desc: '強調「檢視」，最簡單，但少了「審查完成」的訊號。' }
];

const grid = document.getElementById('grid');
let selected = candidates[0].dart;

function render() {
  grid.innerHTML = candidates.map(c => `
    <div class="card ${c.dart === selected ? 'selected' : ''}" data-dart="${c.dart}">
      <div class="top">
        <div class="glyph"><i data-lucide="${c.code}"></i></div>
        <div>
          <div class="name">${c.zh}${c.current ? '<span class="current">目前</span>' : ''}</div>
          <div class="code">${c.dart}</div>
        </div>
      </div>
      <p class="desc">${c.desc}</p>
      <div class="rowmock">
        <i data-lucide="${c.code}"></i>
        <span class="label">回答審查 · 已修正 · 2 個問題</span>
        <span class="chev"><i data-lucide="chevron-right"></i></span>
      </div>
    </div>
  `).join('');
  lucide.createIcons();
  const chosen = candidates.find(c => c.dart === selected);
  document.getElementById('selectedName').textContent = chosen.zh;
  document.getElementById('selectedCode').textContent = `Lucide.${chosen.dart}`;
  document.querySelectorAll('.card').forEach(el => {
    el.addEventListener('click', () => {
      selected = el.dataset.dart;
      render();
    });
  });
}

document.getElementById('themeBtn').addEventListener('click', () => {
  document.documentElement.classList.toggle('dark');
  document.getElementById('themeBtn').textContent = document.documentElement.classList.contains('dark') ? '切換淺色' : '切換深色';
});

render();
</script>
</body>
</html>
